name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install fastapi uvicorn pydantic httpx requests transformers \
                      scikit-learn numpy pandas sentencepiece python-multipart pypdf
          pip install -r requirements-dev.txt

      - name: Pytest acceptance gates
        run: |
          pytest tests/test_detection_contract.py \
                 tests/test_correction_contract.py \
                 tests/test_pipeline_integration.py \
                 tests/test_ui_smoke.py \
                 tests/test_system.py \
                 -v --tb=short
        env:
          JUAKAZI_ML_MODEL: ""

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ steps.login-ecr.outputs.registry }}/juakazi:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build + push Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --network=host \
            --build-arg NEXT_PUBLIC_API_URL=/ \
            -f infra/docker/Dockerfile \
            -t ${{ env.IMAGE_TAG }} .
          docker push ${{ env.IMAGE_TAG }}

      - name: Deploy to App Runner
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='juakazi'].ServiceArn" \
            --output text)
          # Wait for any in-progress operation to finish before updating (max 10 min)
          for i in $(seq 1 20); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query "Service.Status" --output text)
            echo "App Runner status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then break; fi
            if [ $i -eq 20 ]; then echo "Timed out waiting for RUNNING"; exit 1; fi
            sleep 30
          done
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${{ env.IMAGE_TAG }}\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": {
                  \"Port\": \"8000\",
                  \"RuntimeEnvironmentVariables\": {\"ENVIRONMENT\": \"production\", \"JUAKAZI_CORRECTOR_MODEL\": \"juakazike/multilingual-bias-corrector-v3\", \"JUAKAZI_ML_MODEL\": \"juakazike/multilingual-bias-classifier-v1\"}
                }
              },
              \"AuthenticationConfiguration\": {
                \"AccessRoleArn\": \"arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/juakazi-app-runner-ecr-role\"
              },
              \"AutoDeploymentsEnabled\": false
            }"

      - name: Smoke test
        run: |
          SERVICE_URL=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='juakazi'].ServiceUrl" \
            --output text)
          echo "Waiting for /health to return 200 (ML model load takes ~90s)..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${SERVICE_URL}/health)
            echo "Attempt $i: /health returned $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test PASSED — https://${SERVICE_URL}/health returned 200"
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test FAILED — /health did not return 200 after 6 minutes"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
