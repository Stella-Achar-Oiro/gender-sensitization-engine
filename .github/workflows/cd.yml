name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pytest acceptance gates
        run: |
          pytest tests/test_detection_contract.py \
                 tests/test_correction_contract.py \
                 tests/test_pipeline_integration.py \
                 tests/test_ui_smoke.py \
                 tests/test_system.py \
                 -v --tb=short
        env:
          JUAKAZI_ML_MODEL: ""

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/juakazi/juakazi:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build + push Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=/ \
            -f infra/docker/Dockerfile \
            -t ${{ env.IMAGE_TAG }} .
          docker push ${{ env.IMAGE_TAG }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy juakazi \
            --image ${{ env.IMAGE_TAG }} \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --memory 4Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe juakazi \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format "value(status.url)")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SERVICE_URL }}/health)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — /health returned $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED — ${{ env.SERVICE_URL }}/health returned 200"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.SERVICE_URL }}" >> $GITHUB_STEP_SUMMARY
